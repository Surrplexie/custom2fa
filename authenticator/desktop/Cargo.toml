[package]
name = "custom2fa_desktop"
version = "0.3.0"
edition = "2021"

[dependencies]
custom2fa_core = { path = "../core" }
eframe = "0.33"
egui = "0.33"
keyring = "3.6"
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
zeroize = "1.8"
dirs = "6"
rfd = "0.15"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
ico = "0.3"
winres = "0.1"
